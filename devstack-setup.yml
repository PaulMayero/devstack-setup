- name: Vagrant devstack setup
  hosts: devstack-vm
  remote_user: vagrant
  gather_facts: true
  environment:
    GIT_SSL_NO_VERIFY: true
  tasks:
  - name: Clone Devstack from Opendev
    command: /usr/bin/git clone https://opendev.org/openstack/devstack
  - name: Create local.conf
    template:
      src: "local.conf.j2"
      dest: "/home/vagrant/devstack/local.conf"
  - name: Create devstack-status configuration directory
    become: true
    file:
      path: /etc/devstack-status
      state: directory
      owner: root
      group: root
      mode: '0755'
  - name: Install devstack-status service inventory
    become: true
    copy:
      src: assistant/expected_services.json
      dest: /etc/devstack-status/expected_services.json
      owner: root
      group: root
      mode: '0644'
  - name: Install devstack-status command
    become: true
    copy:
      src: assistant/status.py
      dest: /usr/local/bin/devstack-status
      owner: root
      group: root
      mode: '0755'
  - name: Install devstack-status diagnostic guidance
    become: true
    copy:
      src: assistant/diagnose.py
      dest: /usr/local/bin/diagnose.py
      owner: root
      group: root
      mode: '0644'
  - name: Run stack.sh bash script
    command: /home/vagrant/devstack/stack.sh
    register: command_output
  - debug:
      var: command_output.stdout_lines
